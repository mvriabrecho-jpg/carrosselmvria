<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>O MVRIA — Loja</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="Header.jsx"></script><script type="text/babel" src="Home.jsx"></script><script type="text/babel" src="ProductPage.jsx"></script><script type="text/babel" src="Bag.jsx"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const {Toast}=window.OMVRIABrechDesignSystem_bd6a77;
function App(){
const [view,setView]=React.useState(null);const [bag,setBag]=React.useState([]);const [open,setOpen]=React.useState(false);const [favs,setFavs]=React.useState([1]);const [toast,setToast]=React.useState(null);
const toggleFav=id=>setFavs(f=>f.includes(id)?f.filter(x=>x!==id):[...f,id]);
const add=p=>{if(!bag.find(b=>b.id===p.id))setBag([...bag,p]);setToast('Peça adicionada à sacola');setTimeout(()=>setToast(null),2600);};
const go=v=>{setView(v);window.scrollTo(0,0);};
return <div data-screen-label={view?'Produto':'Home'}>
<Header bagCount={bag.length} onHome={()=>go(null)} onBag={()=>setOpen(true)}/>
{view?<ProductPage p={view} onBack={()=>go(null)} onAdd={add} fav={favs.includes(view.id)} toggleFav={()=>toggleFav(view.id)}/>:<Home onOpen={go} favs={favs} toggleFav={toggleFav}/>}
<Footer/>
<Bag open={open} items={bag} onClose={()=>setOpen(false)} onRemove={id=>setBag(bag.filter(b=>b.id!==id))} onCheckout={()=>{setBag([]);setOpen(false);setToast('Pedido confirmado. Obrigada!');setTimeout(()=>setToast(null),2600);}}/>
{toast&&<div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:60}}><Toast action={bag.length?'Ver sacola':undefined} onAction={()=>setOpen(true)}>{toast}</Toast></div>}
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
