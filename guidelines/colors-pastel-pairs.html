<!-- @dsCard group="Colors" viewport="700x130" name="Pastel pairs" subtitle="Each pastel pairs with a deep tone for text on it" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;box-sizing:border-box}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.p{height:82px;display:flex;flex-direction:column;justify-content:space-between;padding:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}.p i{font-family:var(--font-display);font-size:22px;letter-spacing:0;text-transform:none;font-style:italic}</style></head><body><div class="g"><div class="p" style="background:var(--rose);color:var(--rose-deep)"><span>--rose-deep</span><i>Aa</i></div><div class="p" style="background:var(--sage);color:var(--sage-deep)"><span>--sage-deep</span><i>Aa</i></div><div class="p" style="background:var(--lavender);color:var(--lavender-deep)"><span>--lavender-deep</span><i>Aa</i></div><div class="p" style="background:var(--butter);color:var(--butter-deep)"><span>--butter-deep</span><i>Aa</i></div><div class="p" style="background:var(--sky);color:var(--sky-deep)"><span>--sky-deep</span><i>Aa</i></div></div></body></html>
