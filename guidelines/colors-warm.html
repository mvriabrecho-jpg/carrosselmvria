<!-- @dsCard group="Colors" viewport="700x150" name="Warm neutrals" subtitle="Cream, nude e caramelo — os tons atuais do feed" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;box-sizing:border-box}.g{display:grid;gap:12px;grid-template-columns:repeat(6,1fr)}.s{display:flex;flex-direction:column;gap:6px;font-size:12px}.c{height:64px;border:1px solid var(--line)}.s b{font-weight:500}.s span{color:var(--ink-3);font-size:11px;line-height:1.4}</style></head><body><div class="g"><div class="s"><div class="c" style="background:var(--cream)"></div><b>Cream</b><span>--cream<br>#F6F1EA</span></div><div class="s"><div class="c" style="background:var(--nude)"></div><b>Nude</b><span>--nude<br>#F3DDD0</span></div><div class="s"><div class="c" style="background:var(--bronze)"></div><b>Bronze</b><span>--bronze<br>#B8826A</span></div><div class="s"><div class="c" style="background:var(--caramel)"></div><b>Caramelo</b><span>--caramel<br>#9A6636</span></div><div class="s"><div class="c" style="background:var(--caramel-deep)"></div><b>Caramelo escuro</b><span>--caramel-deep<br>#7A4E28</span></div><div class="s"><div class="c" style="background:var(--cocoa)"></div><b>Cacau</b><span>--cocoa<br>#2B2320</span></div></div></body></html>
