<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;box-sizing:border-box}.g{display:grid;gap:12px}.s{display:flex;flex-direction:column;gap:6px;font-size:12px}.c{height:64px;border:1px solid var(--line)}.s b{font-weight:500}.s span{color:var(--ink-3);font-size:11px;line-height:1.4}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="s"><div class="c" style="background:var(--rose)"></div><b>Rosé</b><span>--rose<br>#F4DCDD</span></div><div class="s"><div class="c" style="background:var(--sage)"></div><b>Sálvia</b><span>--sage<br>#DCE6D5</span></div><div class="s"><div class="c" style="background:var(--lavender)"></div><b>Lavanda</b><span>--lavender<br>#E4DEF0</span></div><div class="s"><div class="c" style="background:var(--butter)"></div><b>Manteiga</b><span>--butter<br>#F7EDCB</span></div><div class="s"><div class="c" style="background:var(--sky)"></div><b>Céu</b><span>--sky<br>#D9E7F1</span></div></div></body></html>
