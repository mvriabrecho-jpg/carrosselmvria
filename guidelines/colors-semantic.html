<!-- @dsCard group="Colors" viewport="700x120" name="Semantic" subtitle="Status colors, drawn from the pastel family" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;box-sizing:border-box}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.p{padding:14px;font-size:13px;display:flex;flex-direction:column;gap:4px}.p span{font-size:11px;opacity:.8}</style></head><body><div class="g"><div class="p" style="background:var(--success-bg);color:var(--success)"><b>Sucesso</b><span>--success</span></div><div class="p" style="background:var(--info-bg);color:var(--info)"><b>Info</b><span>--info</span></div><div class="p" style="background:var(--warning-bg);color:var(--warning)"><b>Atenção</b><span>--warning</span></div><div class="p" style="background:var(--danger-bg);color:var(--danger)"><b>Erro</b><span>--danger</span></div></div></body></html>
