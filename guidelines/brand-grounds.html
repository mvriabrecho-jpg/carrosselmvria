<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;box-sizing:border-box}.r{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.s{aspect-ratio:9/16;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-display);font-size:13px;font-style:italic}</style></head><body><div class="r"><div class="s" style="background:var(--paper);border:1px solid var(--line)">limpo</div><div class="s" style="background:var(--rose)">rosé</div><div class="s" style="background:var(--sage)">sálvia</div><div class="s" style="background:var(--lavender)">lavanda</div><div class="s" style="background:var(--butter)">manteiga</div><div class="s" style="background:var(--ink);color:var(--paper)">noite</div></div></body></html>
