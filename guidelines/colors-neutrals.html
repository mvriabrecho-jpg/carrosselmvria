<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Ink, paper, linen — the base of every screen" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;box-sizing:border-box}.g{display:grid;gap:12px}.s{display:flex;flex-direction:column;gap:6px;font-size:12px}.c{height:64px;border:1px solid var(--line)}.s b{font-weight:500}.s span{color:var(--ink-3);font-size:11px;line-height:1.4}</style></head><body><div class="g" style="grid-template-columns:repeat(7,1fr)"><div class="s"><div class="c" style="background:var(--ink)"></div><b>Ink</b><span>--ink<br>#141414</span></div><div class="s"><div class="c" style="background:var(--ink-2)"></div><b>Ink 2</b><span>--ink-2<br>#3A3836</span></div><div class="s"><div class="c" style="background:var(--ink-3)"></div><b>Ink 3</b><span>--ink-3<br>#6E6A66</span></div><div class="s"><div class="c" style="background:var(--ink-4)"></div><b>Ink 4</b><span>--ink-4<br>#A39E98</span></div><div class="s"><div class="c" style="background:var(--line)"></div><b>Line</b><span>--line<br>#E6E1DA</span></div><div class="s"><div class="c" style="background:var(--linen)"></div><b>Linen</b><span>--linen<br>#FAF8F5</span></div><div class="s"><div class="c" style="background:var(--paper)"></div><b>Paper</b><span>--paper<br>#FFFFFF</span></div></div></body></html>
